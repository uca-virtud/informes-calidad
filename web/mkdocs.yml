site_name: Informes de calidad UCA
site_description: Proyecto de automatización asistida de los autoinformes de calidad de los títulos de la Universidad de Cádiz
docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer

nav:
  - Inicio: index.md
  - El proyecto:
      - Visión: VISION.md
      - Hoja de ruta: hoja-de-ruta.md
      - Cómo funciona: como-funciona.md
      - Qué cambia para cada colectivo: colectivos.md
  - Resultados:
      - Evaluaciones de la skill: EVALUACIONES.md
      - "Fase 1: solicitud al SI": peticiones-cartera/solicitud-SI-fase1.md
  - Novedades: novedades.md
  - Glosario: glosario.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

# Sin plugin de búsqueda: el buscador de Material no puede descifrar el índice
# y solo mostraría resultados vacíos.
plugins:
  - include-markdown
  - encryptcontent:
      global_password: !ENV [SITE_PASSWORD, null]
      title_prefix: ''
      tag_encrypted_page: false
      remember_password: true
      session_storage: true
      password_button: true
      password_button_text: Acceder
      summary: Contenido de acceso restringido
      placeholder: Contraseña
      encryption_info_message: Este sitio es para uso interno de la Universidad de Cádiz. Introduce la contraseña facilitada por el equipo del proyecto.
      decryption_failure_message: Contraseña incorrecta.
      search_index: encrypted
      encrypted_something:
        md-nav--secondary: [nav, class]

hooks:
  - hooks/proteccion.py
