name: Publicar sitio web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cifrar las páginas con la contraseña
        working-directory: web
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::Falta el secreto SITE_PASSWORD: la web no se publica sin cifrar."
            exit 1
          fi
          npx -y staticrypt@3 index.html asistente.html procedimiento.html evaluacion.html -d ../publicar --short --remember 30 \
            --template-title "Informes de calidad UCA" \
            --template-instructions "Sitio de uso interno de la Universidad de Cádiz. Introduce la contraseña facilitada por el equipo del proyecto." \
            --template-placeholder "Contraseña" \
            --template-button "Acceder" \
            --template-remember "Recordarme en este dispositivo" \
            --template-error "Contraseña incorrecta" \
            --template-toggle-show "Mostrar contraseña" \
            --template-toggle-hide "Ocultar contraseña" \
            --template-color-primary "#1f3a6e"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
