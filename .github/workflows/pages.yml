name: Publicar sitio web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'skills/uca-informes-calidad/SKILL.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Incrustar SKILL.md en la página del asistente
        run: |
          pip install --quiet markdown
          python - <<'PY'
          import re, pathlib, markdown
          texto = pathlib.Path('skills/uca-informes-calidad/SKILL.md').read_text(encoding='utf-8')
          texto = re.sub(r'\A---\n.*?\n---\n', '', texto, flags=re.S)
          html = markdown.markdown(texto, extensions=['tables', 'fenced_code', 'sane_lists'])
          pagina = pathlib.Path('web/asistente.html')
          contenido, n = re.subn(r'<!-- SKILL_MD -->.*?<!-- /SKILL_MD -->', lambda _: html,
                                 pagina.read_text(encoding='utf-8'), flags=re.S)
          if n != 1:
              raise SystemExit('No se encontró el marcador SKILL_MD en web/asistente.html')
          pagina.write_text(contenido, encoding='utf-8')
          PY
      - name: Cifrar las páginas con la contraseña
        working-directory: web
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::Falta el secreto SITE_PASSWORD: la web no se publica sin cifrar."
            exit 1
          fi
          npx -y staticrypt@3 index.html asistente.html procedimiento.html evaluacion.html -d ../publicar --short --remember 30 \
            --template-title "Informes de calidad UCA" \
            --template-instructions "Sitio de uso interno de la Universidad de Cádiz. Introduce la contraseña facilitada por el equipo del proyecto." \
            --template-placeholder "Contraseña" \
            --template-button "Acceder" \
            --template-remember "Recordarme en este dispositivo" \
            --template-error "Contraseña incorrecta" \
            --template-toggle-show "Mostrar contraseña" \
            --template-toggle-hide "Ocultar contraseña" \
            --template-color-primary "#1f3a6e"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
